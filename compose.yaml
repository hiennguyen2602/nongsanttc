x-app-environment: &app-environment
  DB_CONNECTION: mysql
  DB_HOST: db
  DB_PORT: 3306
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}"
  SESSION_DRIVER: redis
  CACHE_STORE: redis
  QUEUE_CONNECTION: redis

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: nongsanttc-app:local
    restart: unless-stopped
    init: true
    env_file:
      - ${APP_ENV_FILE:-.env}
    environment: *app-environment
    expose:
      - "9000"
    volumes:
      - type: volume
        source: app-storage
        target: /var/www/html/storage
        volume:
          nocopy: true
      - type: volume
        source: app-uploads
        target: /var/www/html/public/uploads
        volume:
          nocopy: true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - php
        - -r
        - "$$s = @fsockopen('127.0.0.1', 9000); if ($$s) { fclose($$s); exit(0); } exit(1);"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    image: nongsanttc-web:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    volumes:
      - type: volume
        source: app-storage
        target: /var/www/html/storage
        read_only: true
        volume:
          nocopy: true
      - type: volume
        source: app-uploads
        target: /var/www/html/public/uploads
        read_only: true
        volume:
          nocopy: true
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  scheduler:
    image: nongsanttc-app:local
    restart: unless-stopped
    init: true
    env_file:
      - ${APP_ENV_FILE:-.env}
    environment: *app-environment
    command:
      - php
      - artisan
      - schedule:work
      - --no-interaction
    volumes:
      - type: volume
        source: app-storage
        target: /var/www/html/storage
        volume:
          nocopy: true
      - type: volume
        source: app-uploads
        target: /var/www/html/public/uploads
        volume:
          nocopy: true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    image: nongsanttc-app:local
    restart: unless-stopped
    init: true
    stop_grace_period: 70s
    env_file:
      - ${APP_ENV_FILE:-.env}
    environment: *app-environment
    command:
      - php
      - artisan
      - queue:work
      - redis
      - --sleep=3
      - --tries=3
      - --timeout=60
      - --max-time=3600
    volumes:
      - type: volume
        source: app-storage
        target: /var/www/html/storage
        volume:
          nocopy: true
      - type: volume
        source: app-uploads
        target: /var/www/html/public/uploads
        volume:
          nocopy: true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  migrate:
    image: nongsanttc-app:local
    profiles:
      - ops
    env_file:
      - ${APP_ENV_FILE:-.env}
    environment: *app-environment
    command:
      - php
      - artisan
      - migrate
      - --force
      - --no-interaction
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:?Set DB_DATABASE in .env}"
      MYSQL_USER: "${DB_USERNAME:?Set DB_USERNAME in .env}"
      MYSQL_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in .env}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping --protocol=tcp -h 127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}"
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --save 60 1000 --requirepass "$${REDIS_PASSWORD}"
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - REDISCLI_AUTH="$${REDIS_PASSWORD}" redis-cli ping | grep -q PONG
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  app-storage:
  app-uploads:
  mysql-data:
  redis-data:
